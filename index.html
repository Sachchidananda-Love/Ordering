<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple weekly beverage ordering tool for the 2026 catalogue." />
    <meta name="theme-color" content="#16725c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Weekly Order" />
    <link rel="icon" type="image/png" href="LOGO.png" />
    <link rel="apple-touch-icon" href="public/assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Weekly order builder · Nantel &amp; McDiarmid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <main id="top">
        <section class="catalogue-layout" aria-label="Catalogue and order summary">
          <div class="catalogue-column">
            <div class="catalogue-toolbar">
              <div>
                <p class="section-kicker">Catalogue 2026</p>
                <h2>Pick your products</h2>
              </div>
              <label class="search-box">
                <span aria-hidden="true">⌕</span>
                <input id="search" type="search" placeholder="Search products or codes" autocomplete="off" />
              </label>
            </div>

            <nav class="category-nav" id="category-nav" aria-label="Product categories"></nav>
            <p class="results-note" id="results-note"></p>
            <div class="product-sections" id="product-sections"></div>
          </div>

          <aside class="order-panel" aria-labelledby="order-title">
            <div class="order-panel-inner">
              <div class="order-panel-heading">
                <div>
                  <p class="section-kicker">Your order</p>
                  <h2 id="order-title">Your selections</h2>
                </div>
                <button class="text-button" id="clear-order" type="button">Clear all</button>
              </div>

              <div class="order-total">
                <strong id="total-units">0</strong>
                <span>cases &amp; boxes selected</span>
              </div>

              <div class="boudreault-total">
                <div>
                  <span>Boudreault priced subtotal</span>
                  <small id="boudreault-shipping-note">Free shipping at $150.00</small>
                </div>
                <strong id="boudreault-total">$0.00</strong>
              </div>

              <div class="selected-list" id="selected-list">
                <div class="empty-state">
                  <span class="empty-icon">＋</span>
                  <p>Your order is empty.</p>
                  <small>Use the quantity controls to add products.</small>
                </div>
              </div>

            </div>
          </aside>
        </section>
      </main>

      <footer class="site-footer">
        <span>Built from Catalogue 2026</span>
        <span>Quantities are saved in this browser only</span>
      </footer>

      <div class="mobile-copy-actions" id="mobile-copy-actions">
        <button class="copy-button mobile-copy-button" id="copy-order-mobile" type="button" data-copy-recipient="nantel">
          <span class="copy-icon">➤</span>
          <span>Send Nantel Email</span>
        </button>
        <button class="copy-button mobile-copy-button conditional-copy-button" id="copy-order-mobile-boudreault" type="button" data-copy-recipient="boudreault" hidden>
          <span class="copy-icon">➤</span>
          <span>Send Boudreault Email</span>
        </button>
        <button class="copy-button mobile-copy-button conditional-copy-button" id="copy-order-mobile-olivia" type="button" data-copy-recipient="olivia" hidden>
          <span class="copy-icon">➤</span>
          <span>Send Olivia/Costco Email</span>
        </button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
